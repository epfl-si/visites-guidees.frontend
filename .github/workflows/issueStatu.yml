name: Move linked issues to "In Review"

# Se déclenche quand une PR est ouverte, modifiée, ou sort du mode brouillon.
# workflow_dispatch permet de tester manuellement depuis l'onglet Actions,
# en donnant un numéro de PR ou un texte brut à analyser, sans ouvrir de vraie PR.
on:
  pull_request:
    types: [opened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      test_text:
        description: 'Texte à analyser (simule le titre+corps de la PR), ex: "fixes #12"'
        required: true
        default: "fixes #12"

jobs:
  move-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Extract issues and update project status
        uses: actions/github-script@v7
        with:
          # Un simple GITHUB_TOKEN n'a PAS les droits d'écriture sur les Projects (v2).
          # Il faut un PAT (classic, scope "project") ou un token d'app GitHub avec
          # la permission "Projects: Read and write", stocké dans les secrets.
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // ---- À adapter ----
            const PROJECT_OWNER = context.repo.owner; // owner de l'org ou du user propriétaire du Project
            const IS_ORG_PROJECT = true;               // false si c'est un Project personnel (user), pas d'org
            const PROJECT_NUMBER = 36;                   // numéro du Project (visible dans son URL)
            const STATUS_FIELD_NAME = "Status";
            const TARGET_STATUS = "In review";
            // --------------------

            // En mode manuel (workflow_dispatch), on utilise le texte fourni.
            // En mode pull_request, on utilise le vrai titre + corps de la PR.
            const isManualRun = context.eventName === "workflow_dispatch";
            const text = isManualRun
              ? context.payload.inputs.test_text
              : `${context.payload.pull_request.title || ""}\n${context.payload.pull_request.body || ""}`;

            // Mots-clés de fermeture reconnus par GitHub
            const regex = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            const issueNumbers = new Set();
            let match;
            while ((match = regex.exec(text)) !== null) {
              issueNumbers.add(parseInt(match[3], 10));
            }

            if (issueNumbers.size === 0) {
              console.log("Aucun mot-clé de fermeture détecté dans cette PR.");
              return;
            }

            // 1. Récupérer l'ID du Project + le champ "Status" et ses options
            const ownerField = IS_ORG_PROJECT ? "organization" : "user";
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                ${ownerField}(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }`;

            const projectData = await github.graphql(projectQuery, {
              owner: PROJECT_OWNER,
              number: PROJECT_NUMBER
            });

            const project = projectData[ownerField].projectV2;
            const statusField = project.fields.nodes.find(f => f.name === STATUS_FIELD_NAME);
            if (!statusField) {
              throw new Error(`Champ "${STATUS_FIELD_NAME}" introuvable dans le Project.`);
            }
            const targetOption = statusField.options.find(o => o.name === TARGET_STATUS);
            if (!targetOption) {
              throw new Error(`Option "${TARGET_STATUS}" introuvable dans le champ "${STATUS_FIELD_NAME}".`);
            }

            // 2. Pour chaque issue référencée, trouver son item dans le Project et changer son statut
            for (const issueNumber of issueNumbers) {
              const issueQuery = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      id
                      projectItems(first: 10) {
                        nodes {
                          id
                          project { id }
                        }
                      }
                    }
                  }
                }`;

              const issueData = await github.graphql(issueQuery, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: issueNumber
              });

              const issue = issueData.repository.issue;
              if (!issue) {
                console.log(`Issue #${issueNumber} introuvable dans ce repo.`);
                continue;
              }

              const item = issue.projectItems.nodes.find(n => n.project.id === project.id);
              if (!item) {
                console.log(`Issue #${issueNumber} n'est pas dans ce Project, on ignore.`);
                continue;
              }

              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }`;

              await github.graphql(mutation, {
                projectId: project.id,
                itemId: item.id,
                fieldId: statusField.id,
                optionId: targetOption.id
              });

              console.log(`Issue #${issueNumber} déplacée vers "${TARGET_STATUS}".`);
            }
